<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Cookie Monster</title>
    <style>
      body { font-family: sans-serif; width: 400px; padding: 12px; background-color: lightblue;}
      h1 { font-size: 16px; margin: 0 0 8px; }
      #domain { color: #555; font-size: 12px; margin-bottom: 12px; }
      table { width: 100%; border-collapse: collapse; font-size: 12px; }
      th, td { text-align: left; padding: 4px; border-bottom: 1px solid #eee; }
    </style>
  </head>
  <body>
    <h1>🍪 Cookie Monster</h1>
    <div id="domain">Loading...</div>
    <div id="firstparty">
      <h3>First Party Cookies</h3>
      <table>
        <thead>
          <tr><th>Cookie name</th><th>Set by</th></tr>
        </thead>
        <tbody id="first-party-rows"></tbody>
      </table>
    </div>
    <div id="thirdparty">
      <h3>Third Party Cookies</h3>
      <table>
        <thead>
          <tr><th>Cookie name</th><th>Set by</th></tr>
        </thead>
        <tbody id="third-party-rows"></tbody>
      </table>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
